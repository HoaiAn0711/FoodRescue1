<!DOCTYPE html>
<html lang="vi">
<head>
     <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOD RESCUE</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
 <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

 <style>

 :root {
 --bg-gradient: linear-gradient(135deg, #e0fcf2 0%, #d4ebf8 100%);
--btn-orange: linear-gradient(90deg, #ff8c42 0%, #fc5c65 100%);
 --btn-orange-glow: 0 8px 20px rgba(252, 92, 101, 0.4);
 --input-bg: #e2f6ed;
--text-dark: #1e293b;
}

 body {
 background: var(--bg-gradient);
color: var(--text-dark);
 font-family: 'Plus Jakarta Sans', sans-serif;
 min-height: 100vh;
 }


 .main-card {
 background: white; padding: 30px; border-radius: 20px;
 box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
 }
 .title { font-weight: 800; color: var(--text-dark); font-size: 1.5rem; }

.input-group { text-align: left; margin-bottom: 20px; width: 100%; display: block; }
 .input-group label { display: block; font-size: 0.85rem; color: #475569; margin-bottom: 8px; font-weight: 600; }
 .input-group input, .input-group textarea {
 width: 100%; padding: 12px 16px; background: var(--input-bg);
 border: 2px solid transparent; border-radius: 12px;
 font-family: inherit; font-size: 0.95rem; color: var(--text-dark);
 box-sizing: border-box; transition: all 0.3s ease; resize: none;
 }
 .input-group input:focus, .input-group textarea:focus { outline: none; border-color: #80ecd1; background: white; }

 .btn-submit {
 width: 100%; padding: 14px; background: var(--btn-orange);
color: white; border: none; border-radius: 30px;
 font-weight: 700; font-size: 1rem; cursor: pointer;
 box-shadow: var(--btn-orange-glow); transition: all 0.2s ease;
 }
 .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(252, 92, 101, 0.5); color: white;}


 .navbar-custom { padding: 1.5rem 0; background: transparent; }
 .brand-title { font-weight: 800; color: #10b981; font-size: 1.4rem; display: flex; align-items: center; gap: 8px; }
 .user-profile-box {
 display: flex; align-items: center; gap: 8px; background: white;
padding: 6px 6px 6px 16px; border-radius: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
 font-weight: 600; font-size: 0.9rem;
 }
 .badge-role { font-size: 0.7rem; padding: 6px 12px; border-radius: 20px; color: white; font-weight: bold; background-color: #f59e0b; }
.btn-logout {
 border: none; color: #ef4444; background: white; border-radius: 50px;
width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
 box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.2s;
 }

.food-card {
 background: white; border-radius: 20px; border: none;
 box-shadow: 0 20px 40px rgba(0,0,0,0.05); transition: transform 0.3s ease;
 overflow: hidden; display: flex; flex-direction: column; height: 100%;
 }
 .food-card:hover { transform: translateY(-5px); }
.food-img-wrapper { width: 100%; height: 220px; padding: 15px; padding-bottom: 0; }
 .food-img-wrapper img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
 .pill-status { padding: 6px 14px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; background: var(--input-bg); color: #16a34a; }

 .btn-outline-custom {
 width: 100%; border: 1px solid #e2e8f0; background: white;
padding: 10px; border-radius: 30px; font-weight: 600; transition: all 0.2s;
}

 .custom-toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1055; display: flex; flex-direction: column; gap: 10px; }
 .custom-toast {
 min-width: 250px; padding: 12px 20px; background: white;
 color: var(--text-dark); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
display: flex; align-items: center; gap: 12px; font-weight: 600; border-left: 5px solid #10b981;
}
</style>
</head>
<body>

    <nav class="navbar navbar-custom">
        <div class="container d-flex justify-content-between align-items-center flex-wrap">
            <span class="brand-title"><i class="bi bi-basket3-fill"></i>FOOD RESCUE</span>
            <div class="d-flex align-items-center gap-3 flex-wrap">
                <div class="user-profile-box">
                    <span id="headerUsername">Đang Tải...</span>
                    <span class="badge-role" id="headerRole">Vai Trò</span>
                </div>
                <button class="btn-logout" onclick="handleLogout()"><i class="bi bi-box-arrow-right"></i></button>
            </div>
        </div>
    </nav>

    <div class="container my-3">
        <div class="row g-4">
       
            <div class="col-lg-4 col-12">
                <div id="leftPanelContainer" style="position: sticky; top: 20px;"></div>
            </div>

       
            <div class="col-lg-8 col-12">
                <h2 class="title mb-4">Bản Tin Cứu Trợ</h2>
                <div class="row g-4" id="foodContainer">
                
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="custom-toast-container"></div>
    <script src="app.js"></script>
</body>
</html>
