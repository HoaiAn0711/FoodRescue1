<!DOCTYPE html>
<html lang="vi">
<head>
 <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Đăng nhập & Đăng ký - Tủ Lạnh 0 Đồng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
 --bg-gradient: linear-gradient(135deg, #e0fcf2 0%, #d4ebf8 100%);
 --btn-orange: linear-gradient(90deg, #ff8c42 0%, #fc5c65 100%);
 --btn-orange-glow: 0 8px 20px rgba(252, 92, 101, 0.4);
--input-bg: #e2f6ed;
--text-dark: #1e293b;
}
 body {
 margin: 0; padding: 0; min-height: 100vh;
display: flex; align-items: center; justify-content: center;
 background: var(--bg-gradient); font-family: 'Plus Jakarta Sans', sans-serif;
}
 .main-card {
 background: white; padding: 40px; border-radius: 20px;
 box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
 width: 100%; max-width: 400px; text-align: center;
 animation: fadeIn 0.3s ease-in-out;
 }
@keyframes fadeIn {
from { opacity: 0; transform: translateY(10px); }
 to { opacity: 1; transform: translateY(0); }
 }
 .title { font-weight: 800; color: var(--text-dark); margin-bottom: 30px; font-size: 1.5rem; }
 .input-group { text-align: left; margin-bottom: 20px; }
 .input-group label { display: block; font-size: 0.85rem; color: #475569; margin-bottom: 8px; font-weight: 600; }
 .input-group input, .input-group select {
 width: 100%; padding: 12px 16px; background: var(--input-bg);
 border: 2px solid transparent; border-radius: 12px;
 font-family: inherit; font-size: 0.95rem; color: var(--text-dark);
 box-sizing: border-box; transition: all 0.3s ease; appearance: none;
 }
.input-group input:focus, .input-group select:focus { outline: none; border-color: #80ecd1; background: white; }
 .btn-submit {
 width: 100%; padding: 14px; background: var(--btn-orange);
 color: white; border: none; border-radius: 30px;
 font-weight: 700; font-size: 1rem; cursor: pointer;
 box-shadow: var(--btn-orange-glow); transition: all 0.2s ease; margin-top: 10px;
 }
 .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(252, 92, 101, 0.5); }
.link-text { margin-top: 20px; font-size: 0.85rem; color: #64748b; }
 .link-text a { color: #27ae60; text-decoration: none; font-weight: 600; cursor: pointer; }
 </style>
</head>
<body>

    <div class="main-card" id="loginBox">
        <h2 class="title">Chào mừng trở lại!</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Email đăng nhập</label>
                <input type="text" id="loginUsername" placeholder="Nhập email..." required>
            </div>
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Đăng Nhập</button>
            <div class="link-text">
                Chưa có tài khoản? <a onclick="toggleForms()">Đăng ký ngay</a>
            </div>
        </form>
    </div>

    <!-- FORM ĐĂNG KÝ -->
    <div class="main-card" id="registerBox" style="display: none;">
        <h2 class="title">Tạo Tài Khoản Mới</h2>
        <form id="registerForm">
            <div class="input-group">
                <label>Email đăng ký</label>
                <input type="email" id="regUsername" placeholder="Ví dụ: vana@gmail.com" required>
            </div>
            <div class="input-group">
                <label>Vai trò tham gia</label>
                <select id="regRole" required>
                    <option value="NGƯỜI NHẬN">Người Nhận Thực Phẩm</option>
                    <option value="NGƯỜI TẶNG">Người Tặng (Đăng Bài)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="regPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Đăng Ký</button>
            <div class="link-text">
                Đã có tài khoản? <a onclick="toggleForms()">Đăng nhập ngay</a>
            </div>
        </form>
    </div>

    <script>
        // Hàm chuyển đổi form Đăng nhập / Đăng ký
        function toggleForms() {
            const loginBox = document.getElementById('loginBox');
            const registerBox = document.getElementById('registerBox');
            
            if (loginBox.style.display === 'none') {
                loginBox.style.display = 'block';
                registerBox.style.display = 'none';
            } else {
                loginBox.style.display = 'none';
                registerBox.style.display = 'block';
            }
        }

        // ==========================================
        // XỬ LÝ ĐĂNG NHẬP
        // ==========================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Lưu username và role từ Backend trả về
                    localStorage.setItem('savedUsername', data.user.username || email);
                    localStorage.setItem('savedRole', data.user.role);
                    
                    window.location.href = 'index.html';
                } else {
                    // Hiển thị thông báo lỗi cụ thể từ Backend (Sai mật khẩu / Tài khoản bị khóa,...)
                    alert(data.message || data.error || 'Đăng nhập thất bại!');
                }
            } catch (error) {
                console.error("Lỗi kết nối:", error);
                alert("Không thể kết nối tới máy chủ! Vui lòng kiểm tra lại Node.js Server.");
            }
        });

        // ==========================================
        // XỬ LÝ ĐĂNG KÝ
        // ==========================================
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('regUsername').value.trim();
            const role = document.getElementById('regRole').value;
            const password = document.getElementById('regPassword').value;

            try {
                const response = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: emailInput, 
                        email: emailInput, 
                        password: password, 
                        role: role 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message || "Đăng ký thành công! Vui lòng Đăng nhập.");
                    toggleForms();
                    document.getElementById('loginUsername').value = emailInput;
                } else {
                    // Hiển thị lý do cụ thể (Ví dụ: "Email đã tồn tại!")
                    alert(data.message || data.error || 'Đăng ký thất bại!');
                }
            } catch (error) {
                console.error("Lỗi kết nối:", error);
                alert("Không thể kết nối tới máy chủ! Vui lòng kiểm tra lại Node.js Server.");
            }
        });
    </script>
</body>
</html>
